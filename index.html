<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Globe Geography Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

    <div class="ui-panel" id="ui-panel">
        <div class="mobile-toggle" onclick="toggleMenu()"> ▬ Swipe/Click to Toggle Menu ▬ </div>
        <h1>Find the Countries in Alphabetical Order</h1>
        

        <div class="controls">
            <label for="game-mode" style="display: block; margin-bottom: 5px; font-weight: bold;">Game Mode:</label>
            <select id="game-mode" class="mode-select">
            <option value="country-en">1. Countries (English)</option>
            <option value="country-pl">2. Countries (Polish)</option>
            <option value="capital-en">3. Capitals (English)</option>
            <option value="capital-pl">4. Capitals (Polish)</option>
            </select>

            <label for="letter-select" style="display: block; margin-top: 10px; margin-bottom: 5px; font-weight: bold;">Letter Selection:</label>
            <select id="letter-select" class="mode-select">
                <option value="all">All Letters (A–Z)</option>
                <option value="all-random">All Letters (A–Z) Random Order</option>
            </select>
            <label for="continent-select" style="display: block; margin-top: 10px; margin-bottom: 5px; font-weight: bold;">Continent:</label>
            <select id="continent-select" class="mode-select">
                <option value="world">World (All)</option>
                <option value="Africa">Africa</option>
                <option value="Asia">Asia</option>
                <option value="Europe">Europe</option>
                <option value="North America">North America</option>
                <option value="Oceania">Oceania</option>
                <option value="South America">South America</option>
            </select>
            <button id="start-btn">Start Game</button>
            <button id="stop-btn" disabled>Stop Game</button>
            <button id="hint-btn" disabled>Give Hint</button>
        </div>

        <div id="game-status" class="hidden">
            <h2><span id="target-mode-label">Countries</span> Starting with the Letter: <span id="target-letter">A</span></h2>
            <p>Remaining: <span id="remaining-count">0</span></p>
        </div>

        <div class="stats">
            <p>Time: <span id="timer">0.0</span>s</p>
            <p>Correct: <span id="correct-clicks">0</span></p>
            <p>Incorrect: <span id="incorrect-clicks">0</span></p>
            <p>Hints: <span id="hint-count">0</span></p>
        </div>
    </div>

    <div id="globe-hud" class="hidden">
        <span class="hud-letter" id="hud-letter">A</span>
        <span class="hud-count" id="hud-count">0 left</span>
    </div>

    <div id="globe-container">
        <div id="completion-modal" class="hidden">
            <button id="close-modal-btn">&times;</button>
            <p>Congratulations! All countries for <strong id="completed-letter">A</strong> completed!</p>
        </div>
        
        <!-- Game Over Modal -->
        <div id="game-over-modal" class="hidden">
            <button id="close-game-over-btn">&times;</button>
            <p id="game-over-text"></p>
        </div>
    </div>

    <div class="zoom-controls">
        <button id="zoom-in">+</button>
        <button id="zoom-out">−</button>
    </div>
    
    <div id="tooltip" class="hidden"></div>

    <script src="script.js"></script>
</body>
</html>
